# I contenuti del sito finiscono da soli sul Discord di OriginsMeta (Pierluigi, 24/09/2026).
# A ogni push su main che tocca news o guide, lo script trova gli slug nuovi, aspetta che le pagine siano online
# (deploy di Vercel) e le pubblica nei canali: news in #announcements e #site-news, patch notes anche in
# #metashifting, guide in #guides (o #site-news). Dettagli in scripts/discord-announce.mjs e nel README, sezione
# "Discord: contenuti automatici". I mazzi della community e i tornei li pubblica il sito stesso, in diretta.
#
# Secret (Settings → Secrets and variables → Actions → New repository secret), uno per canale:
# DISCORD_WEBHOOK_ANNOUNCEMENTS, DISCORD_WEBHOOK_NEWS, DISCORD_WEBHOOK_METASHIFTING, DISCORD_WEBHOOK_DECKS (solo per
# l'archivio) e, facoltativo, DISCORD_WEBHOOK_GUIDES. Un canale senza secret si salta con un avviso.
#
# Accanto agli annunci, IndexNow (Ondata 2 SEO/GEO, 25/09/2026): gli URL nuovi o cambiati (news, guide, schede delle
# carte toccate da una patch o da una rilettura dei testi, luoghi) partono verso Bing e gli altri motori del protocollo
# appena il deploy di produzione è pronto. Nessun secret: la chiave è pubblica (src/lib/indexnow.ts). È un job a
# parte, fuori dalla coda degli annunci, e non ferma mai l'Action: un errore resta un avviso. Dettagli in
# scripts/indexnow.mjs, che confronta gli stessi file elencati qui sotto (FILES; un test controlla che coincidano).
name: Annunci su Discord

on:
  push:
    branches: [main]
    paths:
      - src/lib/data/news.ts
      - src/lib/content/guides.ts
      # i file seguenti servono solo a IndexNow: per loro il job degli annunci non parte
      - src/lib/content/guides-es.ts
      - src/lib/data/card-history.ts
      - src/lib/data/card-lore.ts
      - src/lib/data/locations.ts
  workflow_dispatch:
    inputs:
      backfill_since:
        description: 'Archivio: pubblica tutto da questa data (aaaa-mm-gg), una volta sola. Esempio: 2026-09-01'
        required: false
      slugs:
        description: 'Oppure voci singole, separate da virgola: news:<slug>, guides:<slug>, decks:<slug>'
        required: false
      indexnow:
        description: 'Solo IndexNow, niente Discord: voci separate da virgola (news:<slug>, cards:<slug>, /es/cards, sitemap:/es per una lingua intera)'
        required: false

permissions:
  contents: read

jobs:
  detect:
    # Decide se il run entra nella coda degli annunci: sì a mano (senza il campo indexnow) e per un push che cambia news
    # o guide. I file cambiati si leggono dall'API compare di GitHub fra BEFORE e AFTER, gli stessi due commit che lo
    # script confronta. Il filtro di prima cercava i due file nella lista dei commit dell'evento, ma nel payload del push
    # che GitHub Actions passa al workflow i commit non hanno added/modified/removed (documentazione dell'evento push,
    # changelog GitHub del 16/10/2019): non scattava mai, e il 25/09/2026 ha saltato gli annunci del push delle 15:09
    # UTC (nessuno slug nuovo) e di quello delle 20:15 UTC, con le tre guide dell'Ondata 3 annunciate poi a mano.
    # Se l'API non risponde, risponde senza l'elenco dei file o il confronto arriva a 300 file (il massimo che restituisce),
    # gli annunci partono comunque: lo script annuncia solo gli slug nuovi fra BEFORE e AFTER, al massimo gira senza fare
    # niente. In quel caso però entra nella coda e, se un altro run aspetta, prende il suo posto: il run annullato si
    # recupera con Run workflow e il campo slugs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      announce: ${{ steps.files.outputs.announce }}
    steps:
      - id: files
        name: File cambiati nel push (API compare)
        # bash esplicito vuol dire -eo pipefail; curl e jq restano comunque separati, così il loro esito arriva all'if
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INDEXNOW_ONLY: ${{ github.event.inputs.indexnow }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$INDEXNOW_ONLY" ]; then echo "announce=true" >> "$GITHUB_OUTPUT"; else echo "announce=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ "$EVENT" != "push" ]; then
            echo "announce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # primo push di un branch: lo script non confronta niente (pushItems), quindi niente coda
          if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
            echo "Nessun commit precedente da confrontare: niente annunci"
            echo "announce=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! body=$(curl -sSfL --retry 3 --connect-timeout 10 --max-time 30 \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/compare/$BEFORE...$AFTER") \
              || ! files=$(jq -r 'if (.files | type) == "array" then .files[].filename else error("elenco dei file assente") end' <<< "$body"); then
            echo "::warning::API compare di GitHub non disponibile ($BEFORE...$AFTER): gli annunci partono comunque"
            echo "announce=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(grep -c . <<< "$files" || true)
          echo "File cambiati nel push: $count"
          if [ "$count" -ge 300 ] || grep -qxF -e 'src/lib/data/news.ts' -e 'src/lib/content/guides.ts' <<< "$files"; then
            echo "announce=true" >> "$GITHUB_OUTPUT"
          else
            echo "Né news.ts né guides.ts: niente annunci, solo IndexNow"
            echo "announce=false" >> "$GITHUB_OUTPUT"
          fi

  announce:
    # Quando lo dice `detect`, oppure su un push se `detect` stesso è fallito (per esempio fermato dal timeout): meglio un
    # run che non annuncia niente che annunci persi. Un push delle sole carte, dei luoghi o dei testi spagnoli delle
    # guide non entra nella coda degli annunci: in coda GitHub tiene un solo run in attesa, e un run nuovo annulla quello
    # che aspetta, con le sue news mai annunciate. La condizione è ripetuta nel gruppo di concorrenza, così un job
    # saltato non tocca la coda comunque GitHub ordini `if` e `concurrency`.
    needs: detect
    if: ${{ !cancelled() && (needs.detect.outputs.announce == 'true' || (github.event_name == 'push' && needs.detect.result == 'failure')) }}
    # un invio alla volta: due push ravvicinati non si pestano i piedi
    concurrency:
      group: ${{ (needs.detect.outputs.announce == 'true' || (github.event_name == 'push' && needs.detect.result == 'failure')) && 'discord-announce' || format('discord-announce-skip-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # v7: le v4 giravano su Node 20, che GitHub sta dismettendo (avviso del primo run, 24/09/2026)
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pubblica sul Discord
        run: node scripts/discord-announce.mjs
        env:
          DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_GUIDES: ${{ secrets.DISCORD_WEBHOOK_GUIDES }}
          DISCORD_WEBHOOK_METASHIFTING: ${{ secrets.DISCORD_WEBHOOK_METASHIFTING }}
          DISCORD_WEBHOOK_DECKS: ${{ secrets.DISCORD_WEBHOOK_DECKS }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BACKFILL_SINCE: ${{ github.event.inputs.backfill_since }}
          SLUGS: ${{ github.event.inputs.slugs }}

  indexnow:
    # A ogni push della lista qui sopra, e a mano con i campi indexnow o slugs. Indipendente dagli annunci: parte anche
    # se non partono o falliscono, e senza gruppo di concorrenza, perché l'attesa del deploy (fino a dieci minuti) non
    # deve tenere in coda nessuno; ogni run segnala solo il suo push (BEFORE..AFTER). Mai rosso: continue-on-error.
    if: ${{ github.event_name == 'push' || github.event.inputs.indexnow || github.event.inputs.slugs }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      # IndexNow aspetta il deploy di produzione di Vercel, che GitHub registra come "deployment"
      deployments: read
    steps:
      - uses: actions/checkout@v7
        with:
          # src/lib per src/lib/indexnow.ts, che scripts/indexnow.mjs importa
          sparse-checkout: |
            scripts
            src/lib
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Segnala a IndexNow
        # il flag rende esplicita la lettura del TypeScript di src/lib/indexnow.ts (predefinita da Node 22.18)
        run: node --experimental-strip-types scripts/indexnow.mjs
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SLUGS: ${{ github.event.inputs.slugs }}
          INDEXNOW_TARGETS: ${{ github.event.inputs.indexnow }}
          GITHUB_TOKEN: ${{ github.token }}
