# Ogni news e guida nuova finisce da sola sul Discord di OriginsMeta (Pierluigi, 24/09/2026).
# A ogni push su main che tocca news o guide, lo script confronta gli slug prima e dopo il push, aspetta che le
# pagine nuove siano online (deploy di Vercel) e le manda al canale con un webhook. Dettagli in
# scripts/discord-announce.mjs e nel README, sezione "Annunci su Discord".
#
# Serve il secret DISCORD_WEBHOOK_NEWS (Settings → Secrets and variables → Actions → New repository secret):
# senza, l'Action finisce con un avviso e non manda nulla. DISCORD_WEBHOOK_GUIDES è facoltativo.
name: Annunci su Discord

on:
  push:
    branches: [main]
    paths:
      - src/lib/data/news.ts
      - src/lib/content/guides.ts
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Da annunciare a mano, separati da virgola: news:<slug> o guides:<slug>'
        required: true

permissions:
  contents: read

# un annuncio alla volta: due push ravvicinati non si pestano i piedi
concurrency:
  group: discord-announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Annuncia le news e le guide nuove
        run: node scripts/discord-announce.mjs
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_GUIDES: ${{ secrets.DISCORD_WEBHOOK_GUIDES }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SLUGS: ${{ github.event.inputs.slugs }}
