# I contenuti del sito finiscono da soli sul Discord di OriginsMeta (Pierluigi, 24/09/2026).
# A ogni push su main che tocca news o guide, lo script trova gli slug nuovi, aspetta che le pagine siano online
# (deploy di Vercel) e le pubblica nei canali: news in #announcements e #site-news, patch notes anche in
# #metashifting, guide in #guides (o #site-news). Dettagli in scripts/discord-announce.mjs e nel README, sezione
# "Discord: contenuti automatici". I mazzi della community e i tornei li pubblica il sito stesso, in diretta.
#
# Secret (Settings → Secrets and variables → Actions → New repository secret), uno per canale:
# DISCORD_WEBHOOK_ANNOUNCEMENTS, DISCORD_WEBHOOK_NEWS, DISCORD_WEBHOOK_METASHIFTING, DISCORD_WEBHOOK_DECKS (solo per
# l'archivio) e, facoltativo, DISCORD_WEBHOOK_GUIDES. Un canale senza secret si salta con un avviso.
#
# Dopo gli annunci, IndexNow (Ondata 2 SEO/GEO, 25/09/2026): gli URL nuovi o cambiati nelle tre lingue (news, guide,
# schede delle carte toccate da una patch o da una rilettura dei testi) partono verso Bing e gli altri motori del
# protocollo appena il deploy di produzione è pronto. Nessun secret: la chiave è pubblica (src/lib/indexnow.ts).
# Non ferma mai l'Action: un errore di IndexNow resta un avviso. Dettagli in scripts/indexnow.mjs.
name: Annunci su Discord

on:
  push:
    branches: [main]
    paths:
      - src/lib/data/news.ts
      - src/lib/content/guides.ts
      # solo per IndexNow (schede delle carte): gli annunci su Discord non trovano niente di nuovo e finiscono subito
      - src/lib/data/card-history.ts
      - src/lib/data/card-lore.ts
  workflow_dispatch:
    inputs:
      backfill_since:
        description: 'Archivio: pubblica tutto da questa data (aaaa-mm-gg), una volta sola. Esempio: 2026-09-01'
        required: false
      slugs:
        description: 'Oppure voci singole, separate da virgola: news:<slug>, guides:<slug>, decks:<slug>'
        required: false
      indexnow:
        description: 'Solo IndexNow, niente Discord: voci separate da virgola (news:<slug>, cards:<slug>, /es/cards, sitemap:/es per una lingua intera)'
        required: false

permissions:
  contents: read
  # IndexNow aspetta il deploy di produzione di Vercel, che GitHub registra come "deployment"
  deployments: read

# un invio alla volta: due push ravvicinati non si pestano i piedi
concurrency:
  group: discord-announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # v7: le v4 giravano su Node 20, che GitHub sta dismettendo (avviso del primo run, 24/09/2026)
      - uses: actions/checkout@v7
        with:
          # src/lib per src/lib/indexnow.ts, che scripts/indexnow.mjs importa
          sparse-checkout: |
            scripts
            src/lib
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pubblica sul Discord
        if: ${{ !github.event.inputs.indexnow }}
        run: node scripts/discord-announce.mjs
        env:
          DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          DISCORD_WEBHOOK_GUIDES: ${{ secrets.DISCORD_WEBHOOK_GUIDES }}
          DISCORD_WEBHOOK_METASHIFTING: ${{ secrets.DISCORD_WEBHOOK_METASHIFTING }}
          DISCORD_WEBHOOK_DECKS: ${{ secrets.DISCORD_WEBHOOK_DECKS }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BACKFILL_SINCE: ${{ github.event.inputs.backfill_since }}
          SLUGS: ${{ github.event.inputs.slugs }}
      # Anche se gli annunci falliscono (un webhook che non risponde), e senza mai rendere rossa l'Action.
      - name: Segnala a IndexNow
        if: ${{ !cancelled() }}
        continue-on-error: true
        # il flag rende esplicita la lettura del TypeScript di src/lib/indexnow.ts (predefinita da Node 22.18)
        run: node --experimental-strip-types scripts/indexnow.mjs
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          SLUGS: ${{ github.event.inputs.slugs }}
          INDEXNOW_TARGETS: ${{ github.event.inputs.indexnow }}
          GITHUB_TOKEN: ${{ github.token }}
